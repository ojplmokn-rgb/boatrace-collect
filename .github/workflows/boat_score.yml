name: boat-score
on:
  schedule:
    - cron: '40 14 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: boat-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: k_all
          key: boat-k-${{ github.run_id }}
          restore-keys: boat-k-
      - run: pip install requests pandas numpy gdown
      - run: which 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - run: |
          python -c "import gdown; gdown.download_folder(id='1FyZBGfkYQ1YU0P8IDAx9jGek0Ii8uh1p', output='boat_code', quiet=True)"
          python boat_code/boat_score.py
        env:
          GH_TOKEN: ${{ github.token }}
