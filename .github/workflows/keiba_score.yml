name: keiba-score

on:
  schedule:
    - cron: '45 12 * * *'   # 日本時間 21:45（最終レースのあと）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pandas
      - run: python keiba_score.py
        env:
          GH_TOKEN: ${{ github.token }}
