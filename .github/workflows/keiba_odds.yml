name: keiba-odds

on:
  schedule:
    - cron: '20 0 * * *'   # 日本時間 9:20（昼の開催）
    - cron: '0 6 * * *'    # 日本時間 15:00（ナイター開催）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keiba-odds
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pandas
      - run: python keiba_odds_logger.py
