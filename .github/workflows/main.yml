name: collect
on:
  schedule:
    - cron: '30 21 * * *'   # 06:30 JST（前日の結果を保存）
    - cron: '40 22 * * *'   # 07:40 JST（朝の部）
    - cron: '50 3 * * *'    # 12:50 JST（昼の部）
    - cron: '10 9 * * *'    # 18:10 JST（夜の部）
  workflow_dispatch:
    inputs:
      mode:
        description: 'test（動作確認）/ run（収集）/ results（結果の保存）'
        default: 'test'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python collector.py ${{ github.event.inputs.mode || 'run' }}
