name: collect
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '40 22 * * *'
    - cron: '50 3 * * *'
    - cron: '10 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test / run / results'
        default: 'test'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          M="${{ github.event.inputs.mode || 'run' }}"
          H=$(TZ=Asia/Tokyo date +%-H)
          if [ "$M" = results ] || { [ "$M" = run ] && [ "$H" -lt 7 ]; }; then
            python results.py
          else
            python collector.py "$M"
          fi
